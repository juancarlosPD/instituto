{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Fotografías y recuerdos de quienes comenzamos nuestros estudios en el IES Padre Juan Ruiz de Hinojosa del Duque en 1978.">
    <title>{% block titulo %}Nuestra generación de 1977{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/generacion.css' %}">
</head>
<body>
    <header class="cabecera">
        <a href="{% url 'inicio' %}">IES Padre Juan Ruiz <span>Hinojosa del Duque</span></a>
        <span class="fecha">Desde 1978</span>
    </header>
    <main>{% block contenido %}{% endblock %}</main>
    <footer class="pie">Generación de 1978 · Ayer y hoy, compañeros.</footer>
</body>
</html>
